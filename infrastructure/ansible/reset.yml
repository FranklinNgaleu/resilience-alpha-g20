---
- name: Remise à zéro complète de l’environnement de démo
  hosts: local
  gather_facts: false
  vars:
    project_dir: '{{ playbook_dir }}/../..'
  tasks:
    - name: Supprimer conteneurs et volumes
      command: docker compose down -v
      args:
        chdir: '{{ project_dir }}'
    - name: Relancer la plateforme
      command: docker compose up -d --wait --wait-timeout 180
      args:
        chdir: '{{ project_dir }}'
