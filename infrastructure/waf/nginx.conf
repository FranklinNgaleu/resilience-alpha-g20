events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Masquer la version Nginx
    server_tokens off;

    # Dictionnaire pour le blocage selon les requêtes/URIs
    map $request_uri $block_malicious_uri {
        default 0;
        # Blocage des tentatives d'injection SQL courantes
        "~*select.*from" 1;
        "~*union.*select" 1;
        "~*insert.*into" 1;
        "~*drop.*table" 1;
        # Blocage des attaques XSS et traversal
        "~*(<script|%3cscript)" 1;
        "~*\.\./" 1;
        "~*etc/passwd" 1;
    }

    # Dictionnaire pour le blocage des User-Agents malveillants/scanners
    map $http_user_agent $block_malicious_user_agent {
        default 0;
        "~*nikto" 1;
        "~*sqlmap" 1;
        "~*nmap" 1;
        "~*eval" 1;
    }

    server {
        listen 80;
        server_name localhost;

        # Limitation de la taille du corps de requête (protection DoS)
        client_max_body_size 1M;

        # En-têtes de sécurité HTTP
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location / {
            # Application des filtres de sécurité
            if ($block_malicious_uri) {
                return 403;
            }
            if ($block_malicious_user_agent) {
                return 403;
            }

            # Redirection vers l'API de paiement interne (payment-service)
            proxy_pass http://payment-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}