name: resilience-alpha
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resilience}
      POSTGRES_USER: ${POSTGRES_USER:-resilience}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [internal]
    restart: unless-stopped

  payment-service:
    build: ./services/payment-service
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-resilience}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-resilience}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant}
      ANOMALY_DETECTOR_URL: http://anomaly-detector:8001
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]
    restart: unless-stopped

  auth-service:
    build:
      context: ./services/auth-service
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?}
      DEMO_EMAIL: ${DEMO_EMAIL:?}
      DEMO_PASSWORD_HASH: ${DEMO_PASSWORD_HASH:?}
    ports:
      - "127.0.0.1:8001:8000"
    networks: [internal]


  anomaly-detector:
    build:
      context: ./services/anomaly-detector
    ports:
      - "127.0.0.1:8002:8001"
    networks: [internal]
    restart: unless-stopped

  rag-assistant:
    build:
      context: ./services/rag-assistant
    ports:
      - "127.0.0.1:8003:8002"
    networks: [internal]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/frontend-react
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      payment-service:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    networks: [internal]

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks: [internal]

volumes:
  postgres_data:
  grafana_data:
networks:
  internal:
    driver: bridge
